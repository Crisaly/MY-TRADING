<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRISALY Chart</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#131722;background:#eceef2;display:flex;flex-direction:column;height:100dvh}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:6px;padding:6px 9px;white-space:nowrap}
button:hover{background:#f0f3fa}
button.on{background:#222;color:#fff}
#top{display:flex;align-items:center;gap:4px;background:#fff;padding:6px 8px;overflow-x:auto;flex:none;border-bottom:3px solid #eceef2}
#top select,#symbol{border:0;background:#f0f3fa;border-radius:18px;padding:7px 12px}
#symbol{width:125px;font-weight:700;text-transform:uppercase}
.sep{width:1px;height:22px;background:#e0e3eb;flex:none;margin:0 3px}
.grow{flex:1}
#main{flex:1;display:flex;min-height:0}
#side{width:46px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow-y:auto;flex:none;margin-right:3px;scrollbar-width:none}
#side button{width:36px;height:34px;flex:none;padding:5px;display:grid;place-items:center}
#side hr{width:30px;border:0;border-top:1px solid #e0e3eb;margin:3px;flex:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#wrap{flex:1;position:relative;background:#fff;min-width:0}
#cv{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#quote{position:absolute;left:10px;top:8px;display:flex;align-items:center;gap:10px;font-size:12px}
#quote button{color:#fff;border-radius:7px;padding:4px 14px;line-height:1.25;min-width:100px}
#sell{background:#e0484d}#buy{background:#3562f6}
#quote b{display:block;font-size:14px}
#legend{position:absolute;left:10px;top:58px;font-size:12px;pointer-events:none;color:#555;line-height:1.6;right:90px}
#msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:85%;text-align:center}
#toast{position:fixed;right:16px;bottom:100px;background:#222;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:20}
#bottom{display:flex;align-items:center;gap:2px;background:#fff;padding:3px 8px;overflow-x:auto;flex:none;border-top:1px solid #e0e3eb;font-size:13px}
#ranges{white-space:nowrap}#bottom>*{flex-shrink:0}#clock{white-space:nowrap;padding-left:10px}
#paper{background:#fff;flex:none;border-top:3px solid #eceef2;padding:4px 10px;font-size:13px;max-height:36vh;overflow:auto}
#paperBody{display:none;padding:6px 0}
#paper.open #paperBody{display:block}
#paper input{width:90px;border:1px solid #d1d4dc;border-radius:6px;padding:4px 7px}
#paper table{width:100%;border-collapse:collapse;margin-top:8px}
#paper td,#paper th{text-align:right;padding:4px 6px;border-bottom:1px solid #eee;white-space:nowrap}
.up{color:#089981}.dn{color:#e0484d}
dialog{margin:auto;border:0;border-radius:12px;padding:18px;box-shadow:0 12px 48px #0004;width:min(340px,92vw)}
dialog h3{margin-bottom:12px}
dialog label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
dialog input:not([type=checkbox]):not([type=color]){border:1px solid #d1d4dc;border-radius:6px;padding:6px 8px;width:140px}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.pri{background:#222;color:#fff}.pri:hover{background:#444}
</style>
</head>
<body>

<div id="top">
  <input id="symbol" list="symbols" value="BTCUSDT" aria-label="Symbol">
  <datalist id="symbols"><option>BTCUSDT<option>ETHUSDT<option>SOLUSDT<option>BNBUSDT<option>XRPUSDT<option>ADAUSDT<option>DOGEUSDT<option>LINKUSDT<option>AVAXUSDT<option>LTCUSDT</datalist>
  <select id="tf" aria-label="Timeframe"><option>1m<option>5m<option>15m<option>30m<option>1h<option>4h<option value="1d" selected>D<option value="1w">W<option value="1M">M</select>
  <select id="ctype" aria-label="Chart type"><option value="candle">Candles<option value="hollow">Hollow<option value="bars">Bars<option value="line">Line<option value="heikin">Heikin Ashi</select>
  <span class="sep"></span>
  <button id="indBtn">ƒx Indicators</button>
  <button id="alertBtn">⏰ Alert</button>
  <button id="replayBtn">⏪ Replay</button>
  <span id="replayCtl" hidden><button id="rPlay">▶ Play</button><button id="rStep">Step ›</button><button id="rExit">Exit</button></span>
  <span class="sep"></span>
  <button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button>
  <span class="grow"></span>
  <button id="setBtn" title="Settings">⚙ Settings</button>
  <button id="fsBtn" title="Fullscreen">⛶</button>
  <button id="shotBtn" title="Save picture">📷</button>
</div>

<div id="main">
  <div id="side"></div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="quote"><button id="sell"><b id="bid">–</b>SELL</button><span id="spread"></span><button id="buy"><b id="ask">–</b>BUY</button></div>
    <div id="legend"></div>
    <div id="msg"></div>
  </div>
</div>

<div id="bottom"><span id="ranges"></span><button id="goDate" title="Go to date">📅</button><input type="date" id="dateIn" style="width:0;opacity:0;border:0"><span class="grow"></span><span id="clock"></span></div>

<div id="paper">
  <button id="paperToggle">Paper Trading ▾</button> <span id="paperSum"></span>
  <div id="paperBody">
    Quantity <input id="qty" type="number" value="0.01" min="0" step="any">
    <button id="reset">Reset account</button>
    <table><thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Now / Exit</th><th>P&amp;L</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>

<div id="toast"></div>

<dialog id="indDlg"><form method="dialog"><h3>Indicators</h3>
  <label>Moving average (SMA) <input type="checkbox" id="smaOn"></label><label>SMA length <input type="number" id="smaN" value="50" min="2"></label>
  <label>Exponential average (EMA) <input type="checkbox" id="emaOn"></label><label>EMA length <input type="number" id="emaN" value="20" min="2"></label>
  <label>Volume <input type="checkbox" id="volOn"></label>
  <div class="row"><button class="pri">Done</button></div></form></dialog>

<dialog id="alertDlg"><form method="dialog"><h3>Price alert</h3>
  <label>Alert at price <input type="number" step="any" id="alertPrice"></label>
  <div id="alertList"></div>
  <small>Alerts only work while this page is open.</small>
  <div class="row"><button value="cancel">Close</button><button class="pri" value="add">Add alert</button></div></form></dialog>

<dialog id="setDlg"><form method="dialog"><h3>Settings</h3>
  <label>Up candle <input type="color" id="cUp"></label>
  <label>Down candle <input type="color" id="cDn"></label>
  <label>Grid lines <input type="checkbox" id="grid"></label>
  <label>Log price scale <input type="checkbox" id="logS"></label>
  <label>Dark mode <input type="checkbox" id="dark"></label>
  <div class="row"><button class="pri">Done</button></div></form></dialog>

<script>
'use strict';
const $ = id => document.getElementById(id);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem('cc_' + k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('cc_' + k, JSON.stringify(v)); } catch {} };

const cfg = Object.assign({symbol:'BTCUSDT', tf:'1d', ctype:'candle', up:'#d6d6d6', dn:'#f29d38', grid:false, log:false, dark:false,
  smaOn:false, smaN:50, emaOn:false, emaN:20, volOn:false}, load('cfg', {}));
const TFMS = {'1m':6e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'4h':144e5,'1d':864e5,'1w':6048e5,'1M':2592e6};
const REST = ['https://data-api.binance.vision','https://api.binance.com'];
const WS = 'wss://data-stream.binance.vision/stream?streams=';

let data = [], view = [], ws = null, gen = 0, retry = null;
let barW = 18, right = 0, yAuto = true, yMin = 0, yMax = 1;   // right = bar index at the right edge
let tool = 'cursor', draft = null, selected = null, hover = null, drag = null;
let magnet = true, locked = false, hidden = false;
let drawings = [], undoS = [], redoS = [];
let alerts = load('alerts', []), trades = load('trades', []);
let bid = null, ask = null, lastPrice = {};
let replay = null, playTimer = null, loadingOld = false, noMore = false;

const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
const AXW = 78, AXH = 28;
const PW = () => W - AXW, PH = () => H - AXH;

/* ---------- data ---------- */
async function klines(sym, tf, extra = '') {
  let err;
  for (const base of REST) {
    try {
      const r = await fetch(`${base}/api/v3/klines?symbol=${sym}&interval=${tf}&limit=1000${extra}`);
      if (!r.ok) throw new Error(r.status === 400 ? 'Unknown symbol' : 'Server error ' + r.status);
      return (await r.json()).map(k => ({t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]}));
    } catch (e) { err = e; if (e.message === 'Unknown symbol') break; }
  }
  throw err;
}
function message(text) { $('msg').textContent = text || ''; $('msg').style.display = text ? 'block' : 'none'; }
function toast(text) { const t = $('toast'); t.textContent = text; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 6000); }

async function loadChart() {
  const g = ++gen;
  stopReplay(); clearTimeout(retry);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  data = []; view = []; bid = ask = null; noMore = false; loadingOld = false; draft = selected = null;
  drawings = load('draw_' + cfg.symbol, []); undoS = []; redoS = [];
  updateQuote(); message('Loading ' + cfg.symbol + '…'); render();
  try {
    const d = await klines(cfg.symbol, cfg.tf);
    if (g !== gen) return;
    if (!d.length) throw new Error('No data');
    data = d; view = data; message('');
    barW = Math.max(6, Math.min(24, PW() / 70)); goLatest();
    connect(g);
  } catch (e) {
    if (g !== gen) return;
    message('Could not load ' + cfg.symbol + ': ' + e.message + '. Check the symbol and your connection.');
  }
}
function goLatest() { right = view.length - 1 + Math.max(5, PW() / barW * .4); yAuto = true; render(); }

function connect(g) {
  const s = cfg.symbol.toLowerCase();
  const sock = ws = new WebSocket(`${WS}${s}@kline_${cfg.tf}/${s}@bookTicker`);
  sock.onmessage = ev => {
    if (g !== gen) return;
    const m = JSON.parse(ev.data).data;
    if (m.k) {
      const k = m.k, bar = {t:k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v}, last = data[data.length - 1];
      if (last.t === bar.t) data[data.length - 1] = bar;
      else if (bar.t > last.t) { data.push(bar); if (!replay && right >= data.length - 2) right++; }
      checkAlerts(lastPrice[cfg.symbol], bar.c);
      lastPrice[cfg.symbol] = bar.c;
      updatePaper(); render();
    } else if (m.b) { bid = +m.b; ask = +m.a; updateQuote(); }
  };
  sock.onclose = () => { if (g === gen) retry = setTimeout(() => resync(g), 3000); };
}
async function resync(g) {            // refill any candles missed while disconnected
  try {
    const d = await klines(cfg.symbol, cfg.tf);
    if (g !== gen) return;
    const old = data.filter(x => x.t < d[0].t);
    data = old.concat(d); if (!replay) view = data;
    connect(g); render();
  } catch { if (g === gen) retry = setTimeout(() => resync(g), 5000); }
}
async function loadOlder() {
  if (loadingOld || noMore || replay || !data.length) return;
  loadingOld = true; const g = gen;
  try {
    const d = await klines(cfg.symbol, cfg.tf, '&endTime=' + (data[0].t - 1));
    if (g !== gen) return;
    if (!d.length) noMore = true;
    else { data = d.concat(data); view = data; right += d.length; if (drag && drag.right != null) drag.right += d.length; render(); }
  } catch {}
  if (g === gen) loadingOld = false;
}

/* ---------- coordinates ---------- */
const X = i => PW() - (right - i) * barW;
const I = x => right - (PW() - x) / barW;
const tr = p => cfg.log ? Math.log(p) : p;
const itr = v => cfg.log ? Math.exp(v) : v;
const Y = p => (tr(yMax) - tr(p)) / (tr(yMax) - tr(yMin)) * PH();
const P = y => itr(tr(yMax) - y / PH() * (tr(yMax) - tr(yMin)));
function t2i(t) {
  const n = view.length, step = TFMS[cfg.tf]; if (!n) return 0;
  if (t >= view[n-1].t) return n - 1 + (t - view[n-1].t) / step;
  if (t <= view[0].t) return (t - view[0].t) / step;
  let a = 0, b = n - 1;
  while (b - a > 1) { const m = (a + b) >> 1; view[m].t <= t ? a = m : b = m; }
  return a + (t - view[a].t) / (view[b].t - view[a].t);
}
function i2t(i) {
  const n = view.length, step = TFMS[cfg.tf]; if (!n) return 0;
  if (i >= n - 1) return view[n-1].t + (i - n + 1) * step;
  if (i <= 0) return view[0].t + i * step;
  const a = Math.floor(i); return view[a].t + (i - a) * (view[a+1].t - view[a].t);
}
const sx = pt => X(t2i(pt.t)), sy = pt => Y(pt.p);
function pointAt(x, y) {
  let i = I(x), p = P(y);
  if (magnet && view.length) {
    i = Math.round(i); const c = view[i];
    if (c) { const near = [c.o,c.h,c.l,c.c].reduce((a,b) => Math.abs(Y(b)-y) < Math.abs(Y(a)-y) ? b : a); if (Math.abs(Y(near)-y) < 18) p = near; }
  }
  return {t: i2t(i), p};
}

/* ---------- formatting ---------- */
function dec(p) { return p >= 100 ? 2 : p >= 1 ? 4 : p >= .01 ? 5 : 8; }
const fmt = (p, d = dec(Math.abs(p))) => p.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2, '0');
const daily = () => TFMS[cfg.tf] >= 864e5;
function dparts(t) {   // daily candles are dated in UTC (exchange day); intraday uses your local time
  const d = new Date(t), u = daily() ? 'getUTC' : 'get';
  return {y:d[u+'FullYear'](), m:d[u+'Month'](), d:d[u+'Date'](), h:d[u+'Hours'](), mi:d[u+'Minutes']()};
}
const fullDate = t => { const p = dparts(t); return `${p.d} ${MON[p.m]} ${p.y}` + (daily() ? '' : ` ${pad(p.h)}:${pad(p.mi)}`); };

/* ---------- indicators ---------- */
function sma(d, n) { let s = 0; return d.map((c,i) => { s += c.c; if (i >= n) s -= d[i-n].c; return i >= n-1 ? s/n : null; }); }
function ema(d, n) { const k = 2/(n+1); let e; return d.map((c,i) => { e = i ? c.c*k + e*(1-k) : c.c; return i >= n-1 ? e : null; }); }
function heikin(d) { let po, pc; return d.map((c,i) => { const hc = (c.o+c.h+c.l+c.c)/4, ho = i ? (po+pc)/2 : (c.o+c.c)/2; po = ho; pc = hc; return {t:c.t,o:ho,c:hc,h:Math.max(c.h,ho,hc),l:Math.min(c.l,ho,hc),v:c.v}; }); }

/* ---------- drawing the chart ---------- */
let queued = false;
function render() { if (!queued) { queued = true; requestAnimationFrame(paint); } }
function line(x1,y1,x2,y2) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function tag(y, text, bg, sub) {
  ctx.fillStyle = bg; ctx.fillRect(PW(), y - 10, AXW, sub ? 34 : 20);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(text, PW() + AXW/2, y);
  if (sub) ctx.fillText(sub, PW() + AXW/2, y + 15);
}
function niceStep(raw) { const m = 10 ** Math.floor(Math.log10(raw)); return [1,2,2.5,5,10].map(x => x*m).find(x => x >= raw); }
function countdown() {
  const last = data[data.length-1]; if (!last || replay) return '';
  let end = last.t + TFMS[cfg.tf];
  if (cfg.tf === '1M') { const d = new Date(last.t); end = Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1); }
  let s = Math.max(0, Math.floor((end - Date.now())/1000));
  const days = Math.floor(s/86400); s %= 86400;
  return (days ? days + 'd ' : '') + `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
function paint() {
  queued = false;
  const fg = cfg.dark ? '#d1d4dc' : '#131722', bg = cfg.dark ? '#131722' : '#fff', edge = cfg.dark ? '#d1d4dc' : '#000';
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.font = '12px -apple-system,sans-serif'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
  if (!view.length) { $('legend').textContent = ''; return; }
  const shown = cfg.ctype === 'heikin' ? heikin(view) : view;
  const first = Math.max(0, Math.floor(I(0))), last = Math.min(view.length-1, Math.ceil(right));
  if (yAuto && last >= first) {
    let lo = Infinity, hi = -Infinity;
    for (let i = first; i <= last; i++) { lo = Math.min(lo, shown[i].l); hi = Math.max(hi, shown[i].h); }
    const a = tr(lo), b = tr(hi), m = (b - a || a*.01) * .1;
    yMin = itr(a - m); yMax = itr(b + m);
  }
  // price axis
  const step = niceStep((yMax - yMin) / Math.max(2, PH()/60));
  for (let p = Math.ceil(yMin/step)*step; p <= yMax; p += step) {
    const y = Y(p);
    if (cfg.grid) { ctx.strokeStyle = cfg.dark ? '#242a38' : '#eef0f4'; line(0,y,PW(),y); }
    ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.fillText(fmt(p), PW()+8, y);
  }
  // time axis
  const every = Math.max(1, Math.ceil(70/barW)); let prev = null;
  for (let i = Math.ceil(I(0)/every)*every; i <= right; i += every) {
    const p = dparts(i2t(i)), x = X(i); let label;
    if (daily()) label = prev && prev.y !== p.y ? String(p.y) : (prev && prev.m !== p.m) ? MON[p.m] : String(p.d);
    else label = prev && prev.d !== p.d ? `${p.d} ${MON[p.m]}` : `${pad(p.h)}:${pad(p.mi)}`;
    if (cfg.tf === '1M') label = `${MON[p.m]} ${String(p.y).slice(2)}`;
    prev = p;
    if (cfg.grid) { ctx.strokeStyle = cfg.dark ? '#242a38' : '#eef0f4'; line(x,0,x,PH()); }
    if (x < PW()-20) { ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.fillText(label, x, PH()+14); }
  }
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,PW(),PH()); ctx.clip();
  // volume
  if (cfg.volOn) {
    let mv = 0; for (let i = first; i <= last; i++) mv = Math.max(mv, view[i].v);
    ctx.globalAlpha = .35;
    for (let i = first; i <= last; i++) { const c = view[i], h = c.v/(mv||1)*PH()*.18; ctx.fillStyle = c.c >= c.o ? '#9aa0aa' : cfg.dn; ctx.fillRect(X(i)-barW*.35, PH()-h, barW*.7, h); }
    ctx.globalAlpha = 1;
  }
  // candles
  const bw = Math.max(1, Math.floor(barW*.72));
  if (cfg.ctype === 'line') {
    ctx.strokeStyle = '#3562f6'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = first; i <= last; i++) i === first ? ctx.moveTo(X(i),Y(view[i].c)) : ctx.lineTo(X(i),Y(view[i].c));
    ctx.stroke(); ctx.lineWidth = 1;
  } else for (let i = first; i <= last; i++) {
    const c = shown[i], x = Math.round(X(i))+.5, up = c.c >= c.o, col = up ? cfg.up : cfg.dn;
    if (cfg.ctype === 'bars') { ctx.strokeStyle = up ? '#8a8f99' : cfg.dn; ctx.lineWidth = 1.5; line(x,Y(c.h),x,Y(c.l)); line(x-bw/2,Y(c.o),x,Y(c.o)); line(x,Y(c.c),x+bw/2,Y(c.c)); ctx.lineWidth = 1; continue; }
    ctx.strokeStyle = edge; line(x,Y(c.h),x,Y(c.l));
    const top = Y(Math.max(c.o,c.c)), h = Math.max(1, Y(Math.min(c.o,c.c)) - top);
    ctx.fillStyle = cfg.ctype === 'hollow' && up ? bg : col;
    ctx.fillRect(x-bw/2, top, bw, h); if (bw > 2) ctx.strokeRect(x-bw/2, top, bw, h);
  }
  for (const [on, fn, n, col] of [[cfg.smaOn,sma,cfg.smaN,'#2962ff'],[cfg.emaOn,ema,cfg.emaN,'#9c27b0']]) {
    if (!on) continue;
    const v = fn(view, n); ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.beginPath(); let pen = false;
    for (let i = first; i <= last; i++) { if (v[i] == null) continue; pen ? ctx.lineTo(X(i),Y(v[i])) : ctx.moveTo(X(i),Y(v[i])); pen = true; }
    ctx.stroke(); ctx.lineWidth = 1;
  }
  if (!hidden) drawings.forEach(d => drawShape(d, d === selected, fg));
  if (draft) drawShape(draft, true, fg);
  ctx.restore();

  ctx.strokeStyle = cfg.dark ? '#2a2e39' : '#e0e3eb'; line(PW(),0,PW(),PH()); line(0,PH(),W,PH());
  for (const a of alerts.filter(a => a.symbol === cfg.symbol)) {
    ctx.setLineDash([6,4]); ctx.strokeStyle = '#7e57c2'; line(0,Y(a.price),PW(),Y(a.price)); ctx.setLineDash([]); tag(Y(a.price), fmt(a.price), '#7e57c2');
  }

function beep() { try { const a = new AudioContext(), o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); o.stop(a.currentTime+.35); o.onended = () => a.close(); } catch {} }

/* ---------- replay ---------- */
$('replayBtn').onclick = () => { if (replay || !data.length) return; replay = {picking:true}; setTool('cursor'); toast('Tap a candle to start the replay from there'); };
function startReplayAt(i) {
  i = Math.max(1, Math.min(data.length-2, i));
  replay = {all:data.slice(), n:i+1}; view = replay.all.slice(0, replay.n); $('replayCtl').hidden = false; right = i + PW()/barW*.3; yAuto = true; render();
}
function replayStep() {
  if (!replay || replay.picking) return;
  if (replay.n >= replay.all.length) return pause();
  view.push(replay.all[replay.n++]); right++; render();
}
function pause() { clearInterval(playTimer); playTimer = null; $('rPlay').textContent = '▶ Play'; }
function stopReplay() { pause(); const was = replay; replay = null; $('replayCtl').hidden = true; view = data; if (was && data.length) goLatest(); }
$('rPlay').onclick = () => { if (playTimer) pause(); else { playTimer = setInterval(replayStep, 600); $('rPlay').textContent = '❚❚ Pause'; } };
$('rStep').onclick = replayStep;
$('rExit').onclick = stopReplay;

/* ---------- ranges ---------- */
$('ranges').innerHTML = ['1D','5D','1M','3M','6M','YTD','1Y','5Y','All'].map(r => `<button>${r}</button>`).join('');
const RANGE = {'1D':['1m',1],'5D':['5m',5],'1M':['30m',30],'3M':['1h',91],'6M':['4h',182],'YTD':['1d',0],'1Y':['1d',365],'5Y':['1w',1826],'All':['1w',1e5]};
async function ensureFrom(t) { let guard = 0; while (data.length && data[0].t > t && !noMore && guard++ < 12) { const n = data.length; await loadOlder(); if (data.length === n) break; } }
$('ranges').onclick = async e => {
  if (e.target.tagName !== 'BUTTON') return;
  const key = e.target.textContent, [tf, days] = RANGE[key]; cfg.tf = tf; $('tf').value = tf; saveCfg();
  await loadChart(); const g = gen; if (!data.length) return;
  const from = key === 'YTD' ? Date.UTC(new Date().getUTCFullYear(),0,1) : Date.now() - days*864e5;
  await ensureFrom(from); if (g !== gen) return;
  const i = Math.max(0, t2i(from)), n = view.length - i;
  barW = clampW(PW() / (n*1.04)); right = view.length - 1 + n*.03; yAuto = true; render();
};
$('goDate').onclick = () => { const d = $('dateIn'); d.showPicker ? d.showPicker() : d.click(); };
$('dateIn').onchange = async e => {
  if (!e.target.value || replay) return; const t = Date.parse(e.target.value), g = gen;
  await ensureFrom(t); if (g !== gen) return;
  right = clampRight(t2i(t) + PW()/barW/2); yAuto = true; render();
};

/* ---------- paper trading (practice only, no real orders) ---------- */
const pnl = (t, price) => (price - t.entry) * t.qty * (t.side === 'BUY' ? 1 : -1);
function order(side) {
  const qty = +$('qty').value, price = side === 'BUY' ? ask : bid;
  if (!(qty > 0)) return toast('Enter a quantity');
  if (!price) return toast('Waiting for a live price');
  if (replay) return toast('Exit replay to place a practice trade');
  trades.unshift({id:Date.now(), symbol:cfg.symbol, side, qty, entry:price, exit:null});
  save('trades', trades); updatePaper(true); toast(`Practice ${side} ${qty} ${cfg.symbol} @ ${fmt(price)}`);
}
function updatePaper(rebuild) {
  let open = 0, closed = 0;
  trades.forEach(t => t.exit == null ? open += lastPrice[t.symbol] ? pnl(t,lastPrice[t.symbol]) : 0 : closed += pnl(t,t.exit));
  $('paperSum').textContent = `Open P&L: ${open.toFixed(2)}  ·  Closed P&L: ${closed.toFixed(2)}`;
  if (!$('paper').classList.contains('open') && !rebuild) return;
  $('rows').innerHTML = trades.map(t => {
    const now = t.exit ?? lastPrice[t.symbol], v = now ? pnl(t,now) : null;
    return `<tr><td>${t.symbol.replace(/[^A-Z0-9]/g,'')}</td><td>${t.side === 'BUY' ? 'BUY' : 'SELL'}</td><td>${+t.qty}</td><td>${fmt(+t.entry)}</td><td>${now ? fmt(+now) : '–'}</td><td class="${v>=0?'up':'dn'}">${v == null ? '–' : v.toFixed(2)}</td><td>${t.exit != null ? 'Closed' : t.symbol === cfg.symbol ? `<button data-id="${+t.id}">Close</button>` : 'Open'}</td></tr>`;
  }).join('');
}
$('rows').addEventListener('pointerdown', e => {   // pointerdown: rows refresh with every price tick
  const id = +e.target.dataset?.id; if (!id) return;
  const t = trades.find(x => x.id === id), price = t.side === 'BUY' ? bid : ask;
  if (!price) return toast('Waiting for a live price');
  t.exit = price; save('trades', trades); updatePaper(true);
});
$('buy').onclick = () => order('BUY');
$('sell').onclick = () => order('SELL');
$('reset').onclick = () => { if (confirm('Clear all practice trades?')) { trades = []; save('trades', trades); updatePaper(true); } };
$('paperToggle').onclick = () => { $('paper').classList.toggle('open'); updatePaper(true); };
function updateQuote() {
  $('bid').textContent = bid ? fmt(bid) : '–'; $('ask').textContent = ask ? fmt(ask) : '–';
  $('spread').textContent = bid ? fmt(ask-bid, dec(bid)) : '';
}

/* ---------- start ---------- */
new ResizeObserver(() => {
  const r = $('wrap').getBoundingClientRect(), k = devicePixelRatio || 1, oldPW = PW();
  if (view.length && oldPW > 0 && r.width > AXW) { const gap = right - (view.length-1); if (gap > 0) right -= gap * (1 - (r.width-AXW)/oldPW); }
  W = r.width; H = r.height; cv.width = W*k; cv.height = H*k; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(k,0,0,k,0,0); render();
}).observe($('wrap'));
setInterval(() => {
  const d = new Date(), off = -d.getTimezoneOffset()/60;
  $('clock').textContent = `${d.toLocaleTimeString('en-GB')} UTC${off >= 0 ? '+' : ''}${off}`;
  render();
}, 1000);
$('symbol').value = cfg.symbol; $('tf').value = cfg.tf; $('ctype').value = cfg.ctype;
theme(); paintSide(); updatePaper();
W = $('wrap').clientWidth; H = $('wrap').clientHeight;
loadChart();
</script>
</body>
</html>
