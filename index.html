<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRISALY Chart</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#131722;background:#eceef2;display:flex;flex-direction:column;height:100dvh}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:6px;padding:6px 9px;white-space:nowrap}
button:hover{background:#f0f3fa}
button.on{background:#222;color:#fff}
#top{display:flex;align-items:center;gap:4px;background:#fff;padding:6px 8px;overflow-x:auto;flex:none;border-bottom:3px solid #eceef2}
#top select,#symbol{border:0;background:#f0f3fa;border-radius:18px;padding:7px 12px}
#symbol{width:125px;font-weight:700;text-transform:uppercase}
.sep{width:1px;height:22px;background:#e0e3eb;flex:none;margin:0 3px}
.grow{flex:1}
#main{flex:1;display:flex;min-height:0}
#side{width:46px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow-y:auto;flex:none;margin-right:3px;scrollbar-width:none}
#side button{width:36px;height:34px;flex:none;padding:5px;display:grid;place-items:center}
#side hr{width:30px;border:0;border-top:1px solid #e0e3eb;margin:3px;flex:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#wrap{flex:1;position:relative;background:#fff;min-width:0}
#cv{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#quote{position:absolute;left:10px;top:8px;display:flex;align-items:center;gap:10px;font-size:12px}
#quote button{color:#fff;border-radius:7px;padding:4px 14px;line-height:1.25;min-width:100px}
#sell{background:#e0484d}#buy{background:#3562f6}
#quote b{display:block;font-size:14px}
#legend{position:absolute;left:10px;top:58px;font-size:12px;pointer-events:none;color:#555;line-height:1.6;right:90px}
#msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:85%;text-align:center}
#toast{position:fixed;right:16px;bottom:100px;background:#222;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:20}
#bottom{display:flex;align-items:center;gap:2px;background:#fff;padding:3px 8px;overflow-x:auto;flex:none;border-top:1px solid #e0e3eb;font-size:13px}
#ranges{white-space:nowrap}#bottom>*{flex-shrink:0}#clock{white-space:nowrap;padding-left:10px}
#paper{background:#fff;flex:none;border-top:3px solid #eceef2;padding:4px 10px;font-size:13px;max-height:36vh;overflow:auto}
#paperBody{display:none;padding:6px 0}
#paper.open #paperBody{display:block}
#paper input{width:90px;border:1px solid #d1d4dc;border-radius:6px;padding:4px 7px}
#paper table{width:100%;border-collapse:collapse;margin-top:8px}
#paper td,#paper th{text-align:right;padding:4px 6px;border-bottom:1px solid #eee;white-space:nowrap}
.up{color:#089981}.dn{color:#e0484d}
dialog{margin:auto;border:0;border-radius:12px;padding:18px;box-shadow:0 12px 48px #0004;width:min(340px,92vw)}
dialog h3{margin-bottom:12px}
dialog label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
dialog input:not([type=checkbox]):not([type=color]){border:1px solid #d1d4dc;border-radius:6px;padding:6px 8px;width:140px}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.pri{background:#222;color:#fff}.pri:hover{background:#444}

/* drawing toolbar collapse handle */
#sideTog{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:6;width:15px;height:42px;padding:0;border-radius:0 8px 8px 0;background:#131722;color:#fff;font-size:13px;line-height:1;display:grid;place-items:center;opacity:.85;box-shadow:0 1px 6px #0004}
#sideTog:hover{opacity:1;background:#2962ff}
body.sideHidden #side{display:none}
/* symbol search */
#symDlg{width:min(640px,96vw);padding:0;border-radius:14px;top:8vh;margin:0 auto}
#symTop{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
#symDlg #symQ{flex:1;border:0;background:none;font-size:20px;outline:none;color:inherit;text-transform:uppercase;width:auto;padding:0;border-radius:0}
#symChips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 18px 10px}
#symChips button{border-radius:18px;background:#f0f3fa;padding:6px 14px;color:#131722}
#symChips button.on{background:#131722;color:#fff}
#symList{max-height:56vh;overflow:auto;padding:4px 6px 10px}
.symRow{display:flex;align-items:center;gap:12px;padding:8px 12px;cursor:pointer;border-radius:10px}
.symRow.act{background:#f0f3fa}
.symAv{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.symMain b{color:#2962ff;font-size:16px;font-weight:600}.symMain small{display:block;opacity:.75;margin-top:2px}
.symTag{font-size:10px;font-weight:700;background:#eceef2;border-radius:4px;padding:1px 6px;margin-left:6px;letter-spacing:.3px;color:#555}
.symEx{margin-left:auto;font-size:13px;opacity:.75;white-space:nowrap}
.symNote{padding:8px 14px;font-size:13px;opacity:.7}
/* chart navigation (shows on hover) */
#nav{position:absolute;z-index:5;left:calc((100% - 78px) / 2);transform:translateX(-50%);bottom:42px;display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .15s}
#wrap:hover #nav,#nav:focus-within{opacity:1;pointer-events:auto}
@media (hover:none){#nav{opacity:1;pointer-events:auto}}
#nav button{width:34px;height:30px;padding:0;display:grid;place-items:center;background:#fff;color:#131722;border-radius:7px;box-shadow:0 1px 6px #0003;border:1px solid #e0e3eb}
#nav button:hover{background:#f0f3fa}
#nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#navTip{position:absolute;z-index:6;background:#131722;color:#fff;border-radius:6px;padding:6px 10px;font-size:13px;white-space:nowrap;pointer-events:none;transform:translateX(-50%);display:none}
#navTip kbd{background:#434651;border-color:#434651;color:#fff;margin-left:6px}
/* favorites toolbar */
#side button{position:relative}
#side button.fav::after{content:"\2605";position:absolute;top:0;right:3px;font-size:9px;color:#f5a623}
#favBar{position:absolute;z-index:6;display:flex;align-items:center;gap:1px;background:#fff;color:#131722;border:1px solid #e0e3eb;border-radius:10px;box-shadow:0 2px 14px #0003;padding:3px 6px 3px 2px;user-select:none}
#favBar[hidden],#favPick[hidden]{display:none}
#favGrip{cursor:grab;padding:0 5px;color:#aaa;font-size:15px;letter-spacing:-3px;touch-action:none}
#favBar button{width:34px;height:34px;padding:5px;background:none;border-radius:6px}
#favBar button:hover{background:#f0f3fa}#favBar button.on{background:#2962ff;color:#fff}
#favBar svg,#favPick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#favPick{position:absolute;z-index:7;background:#fff;color:#131722;border-radius:10px;box-shadow:0 8px 30px #0004;padding:6px;width:250px;max-height:70%;overflow:auto}
#favPick div{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:6px;cursor:pointer}
#favPick div:hover{background:#f0f3fa}#favPick b{margin-left:auto;color:#ccc;font-size:16px}#favPick .f b{color:#f5a623}
/* drawing settings bar */
#drawBar{position:absolute;z-index:6;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid #e0e3eb;border-radius:10px;box-shadow:0 4px 18px #0003;padding:4px 6px;white-space:nowrap;max-width:calc(100% - 12px);overflow-x:auto}
#drawBar[hidden]{display:none}
#drawBar select{border:0;background:#f0f3fa;border-radius:6px;padding:5px 4px}
#drawBar input[type=color]{width:30px;height:30px;border:0;padding:2px;background:none;cursor:pointer;border-radius:6px}
#drawBar input[type=range]{width:70px;vertical-align:middle}
#drawBar label{font-size:12px;display:flex;align-items:center;gap:4px;padding:0 4px}
#drawBar button{padding:5px 8px;font-size:15px}
#drawBar .sp{width:1px;height:20px;background:#e0e3eb;margin:0 3px;flex:none}
#drawBar [hidden]{display:none!important}
/* drawing settings dialog */
#drDlg{width:min(460px,94vw);padding:0}
#drBox{padding:20px 22px}
.drHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.drHead h3{margin:0;font-size:20px}
.drTabs{display:flex;gap:18px;border-bottom:2px solid #eceef2;margin-bottom:16px}
.drTabs button{padding:8px 2px;border-radius:0;font-weight:600;opacity:.6;border-bottom:2px solid transparent;margin-bottom:-2px;background:none}
.drTabs button.on{background:none;color:inherit;opacity:1;border-bottom-color:currentColor}
.drTabs button:hover{background:none;opacity:1}
.drPane{display:none}.drPane.on{display:block}
.drRow{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.drRow>span{min-width:96px}
#drDlg select,#drDlg textarea,#drDlg input:not([type=range]):not([type=checkbox]):not([type=color]){border:1px solid #d1d4dc;border-radius:8px;padding:8px 10px;background:transparent;color:inherit}
#drDlg input[type=color]{width:40px;height:36px;padding:2px;border:1px solid #d1d4dc;border-radius:8px;background:none;cursor:pointer}
#drDlg input[type=datetime-local]{width:210px}
#drDlg textarea{width:100%;min-height:90px;resize:vertical;font:inherit;margin:6px 0}
#drDlg .tg{border:1px solid #d1d4dc;width:40px;height:36px;padding:0;font-size:16px;border-radius:8px}
#drDlg .tg.on{background:#222;color:#fff}
.drFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.drFoot button{border:1px solid currentColor;padding:8px 18px;border-radius:8px}
.drFoot .pri{border-color:#222}
.drChk{display:flex;align-items:center;gap:10px;margin:8px 0}
#kbDlg table{border-collapse:collapse;width:100%}
#kbDlg td{padding:5px 4px;border-bottom:1px solid #eee}
#kbDlg td:last-child{text-align:right;white-space:nowrap}
kbd{background:#f0f3fa;border:1px solid #d1d4dc;border-radius:5px;padding:1px 6px;font:12px monospace;color:inherit}
/* pane splitters */
#panes{position:relative}
#panes.dragging iframe{pointer-events:none}
.spl{position:absolute;z-index:4;touch-action:none}
.spl.v{cursor:col-resize;width:11px}
.spl.h{cursor:row-resize;height:11px}
.spl::after{content:"";position:absolute;background:#2962ff;opacity:0;transition:opacity .12s}
.spl.v::after{left:4px;width:3px;top:0;bottom:0}
.spl.h::after{top:4px;height:3px;left:0;right:0}
.spl:hover::after,.spl.act::after{opacity:.55}
/* layouts */
#layBtn{display:flex;align-items:center;gap:6px}
#layBtn svg{width:20px;height:20px}
#panes{flex:1;display:none;min-height:0;gap:3px;background:#eceef2;padding:0}
#panes iframe{border:0;width:100%;height:100%;background:#fff;min-width:0;min-height:0}
body.multi #main,body.multi #bottom,body.multi #paper{display:none}
body.multi #panes{display:grid}
body.multi #top>*:not(.keep){display:none}
body.multi #top .keep.grow{display:block}
#layPop{position:fixed;z-index:30;background:#fff;color:#131722;border-radius:10px;box-shadow:0 8px 40px #0004;padding:6px 10px 10px;width:min(560px,96vw);max-height:84vh;overflow:auto;display:none}
#layPop .lr{display:flex;align-items:center;gap:6px;border-bottom:1px solid #e0e3eb;padding:6px 0;flex-wrap:wrap}
#layPop .n{width:22px;font-size:11px;color:#888;text-align:center;flex:none}
#layPop .lb{width:42px;height:38px;padding:4px;border-radius:6px;display:grid;place-items:center;color:#777}
#layPop .lb svg{width:32px;height:30px;stroke-width:1.3}
#layPop .lb.sel{background:#2962ff;color:#fff}
#layPop .sy{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;padding-top:6px}
#layPop .sy label{display:flex;align-items:center;gap:8px;padding:7px 8px;cursor:pointer;border-radius:6px;font-size:13px;text-transform:uppercase;letter-spacing:.3px}
#layPop .sy label:hover{background:#f0f3fa}
body.pane #top{padding:3px 6px}
body.pane #top>*:not(#symbol):not(#tf):not(#ctype):not(#indBtn):not(#setBtn):not(.sep):not(.grow){display:none}
body.pane #paper,body.pane #bottom,body.pane #quote{display:none}
body.pane #legend{top:8px}
body.pane.tight #side{display:none}
body.pane #symbol{width:100px}
</style>
</head>
<body>

<div id="top">
  <button id="layBtn" class="keep" title="Chart layout" aria-label="Chart layout"></button>
  <span class="sep keep" style="display:block"></span>
  <input id="symbol" list="symbols" value="BTCUSDT" aria-label="Symbol">
  <datalist id="symbols"><option>BTCUSDT<option>ETHUSDT<option>SOLUSDT<option>BNBUSDT<option>XRPUSDT<option>ADAUSDT<option>DOGEUSDT<option>LINKUSDT<option>AVAXUSDT<option>LTCUSDT</datalist>
  <select id="tf" aria-label="Timeframe"><option>1s<option>1m<option>3m<option>5m<option>15m<option>30m<option>1h<option>2h<option>4h<option value="1d" selected>D<option value="1w">W<option value="1M">M<option value="__c">+ Custom…</select>
  <select id="ctype" aria-label="Chart type"><option value="candle">Candles<option value="hollow">Hollow<option value="bars">Bars<option value="line">Line<option value="heikin">Heikin Ashi</select>
  <span class="sep"></span>
  <button id="indBtn">ƒx Indicators</button>
  <button id="alertBtn">⏰ Alert</button>
  <button id="replayBtn">⏪ Replay</button>
  <span id="replayCtl" hidden><button id="rPlay">▶ Play</button><button id="rStep">Step ›</button><button id="rExit">Exit</button></span>
  <span class="sep"></span>
  <button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button>
  <span class="grow keep"></span>
  <button id="setBtn" title="Settings">⚙ Settings</button>
  <button id="kbBtn" title="Keyboard shortcuts (?)">⌨</button>
  <button id="fsBtn" class="keep" title="Fullscreen">⛶</button>
  <button id="shotBtn" title="Save picture">📷</button>
</div>

<div id="main">
  <div id="side"></div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="quote"><button id="sell"><b id="bid">–</b>SELL</button><span id="spread"></span><button id="buy"><b id="ask">–</b>BUY</button></div>
    <div id="legend"></div>
    <div id="msg"></div>
    <button id="sideTog" title="Hide drawing toolbar" aria-label="Hide drawing toolbar">&#8249;</button>
    <div id="nav">
      <button data-nav="out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button data-nav="in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      <button data-nav="left" aria-label="Scroll to the left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-nav="right" aria-label="Scroll to the right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button data-nav="reset" aria-label="Reset chart view"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8H8M8 4L5 7l3 3"/></svg></button>
    </div>
    <div id="navTip"></div>
    <div id="favBar" hidden><span id="favGrip" title="Drag to move">&#8942;&#8942;</span><span id="favBtns"></span><button id="favAdd" title="Add / remove favorite tools">+</button></div>
    <div id="favPick" hidden></div>
    <div id="drawBar" hidden>
      <input type="color" id="dbColor" title="Color">
      <label id="dbFillL" title="Fill opacity">Fill <input type="range" id="dbFill" min="0" max="80" value="12"></label>
      <label id="dbAlphaL" title="Line opacity">Opacity <input type="range" id="dbAlpha" min="10" max="100" value="100"></label>
      <span class="sp"></span>
      <select id="dbW" title="Line thickness"><option value="1">1px<option value="1.6">2px<option value="2.5">3px<option value="3.5">4px<option value="5">5px<option value="7">7px</select>
      <select id="dbDash" title="Line style"><option value="solid">&#9473; Solid<option value="dashed">&#9548; Dashed<option value="dotted">&#9479; Dotted</select>
      <select id="dbSize" title="Text size"><option>12<option>15<option>18<option>24<option>32<option>48</select>
      <button id="dbEdit" title="Add / edit text">Aa</button>
      <button id="dbSet" title="Settings (double-click the drawing)">&#9881;</button>
      <span class="sp"></span>
      <button id="dbClone" title="Clone">&#10697;</button>
      <button id="dbLock" title="Lock this drawing">&#128275;</button>
      <button id="dbDel" title="Delete">&#128465;</button>
    </div>
  </div>
</div>

<div id="panes"></div>

<div id="bottom"><span id="ranges"></span><button id="goDate" title="Go to date">📅</button><input type="date" id="dateIn" style="width:0;opacity:0;border:0"><span class="grow"></span><span id="clock"></span></div>

<div id="paper">
  <button id="paperToggle">Paper Trading ▾</button> <span id="paperSum"></span>
  <div id="paperBody">
    Quantity <input id="qty" type="number" value="0.01" min="0" step="any">
    <button id="reset">Reset account</button>
    <table><thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Now / Exit</th><th>P&amp;L</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>

<dialog id="drDlg"><div id="drBox">
  <div class="drHead"><h3 id="drTitle"></h3><button id="drX" title="Close">&#10005;</button></div>
  <div class="drTabs" id="drTabs"><button data-tab="style">Style</button><button data-tab="text">Text</button><button data-tab="coords">Coordinates</button><button data-tab="vis">Visibility</button></div>
  <div class="drPane" data-pane="style">
    <div class="drRow" id="rowColor"><span>Color</span><input type="color" id="drColor"></div>
    <div class="drRow" id="rowAlpha"><span>Line opacity</span><input type="range" id="drAlpha" min="10" max="100"></div>
    <div class="drRow" id="rowW"><span>Thickness</span><select id="drW"><option value="1">1px<option value="1.6">2px<option value="2.5">3px<option value="3.5">4px<option value="5">5px<option value="7">7px</select></div>
    <div class="drRow" id="rowDash"><span>Line style</span><select id="drDash"><option value="solid">Solid<option value="dashed">Dashed<option value="dotted">Dotted</select></div>
    <div class="drRow" id="rowFill"><span>Fill opacity</span><input type="range" id="drFill" min="0" max="80"></div>
  </div>
  <div class="drPane" data-pane="text">
    <div class="drRow"><input type="color" id="drTColor" title="Text color"><select id="drTSize" title="Size"><option>10<option>12<option>14<option>15<option>18<option>24<option>32<option>48</select><button class="tg" id="drB" title="Bold"><b>B</b></button><button class="tg" id="drI" title="Italic"><i>I</i></button></div>
    <textarea id="drText" placeholder="Add text"></textarea>
    <div class="drRow" id="rowAlign"><span>Text alignment</span><select id="drV"><option value="top">Top<option value="middle">Middle<option value="bottom">Bottom</select><select id="drH"><option value="left">Left<option value="center">Center<option value="right">Right</select></div>
  </div>
  <div class="drPane" data-pane="coords"><div id="drCoords"></div></div>
  <div class="drPane" data-pane="vis"><div id="drVis"></div><small>Untick a timeframe to hide this drawing on it.</small></div>
  <div class="drFoot"><button id="drCancel">Cancel</button><button class="pri" id="drOk">Ok</button></div>
</div></dialog>

<dialog id="symDlg">
  <div id="symTop"><span style="font-size:20px">&#128269;</span><input id="symQ" placeholder="Search symbol (e.g. BTC, ETHUSDT, gold)" autocomplete="off" spellcheck="false"><button id="symClear" style="background:none">Clear</button><button id="symX" aria-label="Close" style="background:none">&#10005;</button></div>
  <div id="symChips"></div>
  <div id="symList"></div>
</dialog>

<dialog id="tfDlg"><h3>Custom timeframe</h3>
  <div class="drRow" style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="number" id="tfN" min="1" max="999" value="7" style="width:90px"><select id="tfU"><option value="s">seconds<option value="m" selected>minutes<option value="h">hours<option value="d">days<option value="w">weeks</select></div>
  <small id="tfInfo"></small>
  <div id="tfList" style="margin:12px 0"></div>
  <div class="row"><button id="tfCancel">Close</button><button class="pri" id="tfAdd">Apply</button></div>
</dialog>

<dialog id="kbDlg"><h3>Keyboard shortcuts</h3><table id="kbTable"></table><div class="row"><button class="pri" onclick="$('kbDlg').close()">Close</button></div></dialog>

<div id="toast"></div>
<div id="layPop"></div>

<dialog id="indDlg"><form method="dialog"><h3>Indicators</h3>
  <label>Moving average (SMA) <input type="checkbox" id="smaOn"></label><label>SMA length <input type="number" id="smaN" value="50" min="2"></label>
  <label>Exponential average (EMA) <input type="checkbox" id="emaOn"></label><label>EMA length <input type="number" id="emaN" value="20" min="2"></label>
  <label>Volume <input type="checkbox" id="volOn"></label>
  <div class="row"><button class="pri">Done</button></div></form></dialog>

<dialog id="alertDlg"><form method="dialog"><h3>Price alert</h3>
  <label>Alert at price <input type="number" step="any" id="alertPrice"></label>
  <div id="alertList"></div>
  <small>Alerts only work while this page is open.</small>
  <div class="row"><button value="cancel">Close</button><button class="pri" value="add">Add alert</button></div></form></dialog>

<script>

const cfg = Object.assign({symbol:'BTCUSDT', tf:'1d', ctype:'candle', up:'#d6d6d6', dn:'#f29d38', grid:false, log:false, dark:false,
  smaOn:false, smaN:50, emaOn:false, emaN:20, volOn:false}, load('cfg', {}), PANE ? load(CFGKEY, {}) : {});
/* timeframes: Binance-native intervals are fetched directly; any custom one (7s, 7m, 90m, 5h, 3d, 2w …) is built by aggregating a smaller native interval */
const NATIVE = {'1s':1e3,'1m':6e4,'3m':18e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'2h':72e5,'4h':144e5,'6h':216e5,'8h':288e5,'12h':432e5,'1d':864e5,'3d':2592e5,'1w':6048e5};

let liveTail = new Map();                                      // base candles of the newest custom candle
const REST = ['https://data-api.binance.vision','https://api.binance.com'];
const WS = 'wss://data-stream.binance.vision/stream?streams=';

let data = [], view = [], ws = null, gen = 0, retry = null;

let bid = null, ask = null, lastPrice = {};

const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
const AXW = 78, AXH = 28;

/* ---------- data ---------- */
async function klinesTf(sym, tf, extra = '') {
  if (isNative(tf)) return klines(sym, tf, extra);
  const base = baseOf(tf), bms = NATIVE[base], ms = TFMS[tf], ratio = ms / bms;
  const em = /endTime=(\d+)/.exec(extra), E = em ? +em[1] : Date.now();
  const pages = Math.min(12, Math.max(1, Math.ceil(500 * ratio / 1000)));
  const res = await Promise.all(Array.from({length: pages}, (_, k) => { const q = klines(sym, base, '&endTime=' + (E - k * 1000 * bms)); return k ? q.catch(() => []) : q; }));
  const seen = new Map(); res.flat().forEach(c => seen.set(c.t, c));
  const src = [...seen.values()].sort((a, b) => a.t - b.t), out = [];
  src.forEach(c => {
    const t = bucketOf(c.t, tf), last = out[out.length - 1];
    if (last && last.t === t) { last.h = Math.max(last.h, c.h); last.l = Math.min(last.l, c.l); last.c = c.c; last.v += c.v; }
    else out.push({t, o:c.o, h:c.h, l:c.l, c:c.c, v:c.v, first:c.t});

  if (out.length > 1 && out[0].first > out[0].t) out.shift();    // first bucket is incomplete

}
function aggBar(k, last) {   // fold a live base-interval candle into the current custom candle
  const b = {t:k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v}, t = bucketOf(b.t, cfg.tf);
  if (last && t < last.t) return null;

  const a = [...liveTail.values()].sort((x, y) => x.t - y.t);
  return {t, o:a[0].o, h:Math.max(...a.map(x => x.h)), l:Math.min(...a.map(x => x.l)), c:a[a.length - 1].c, v:a.reduce((s, x) => s + x.v, 0)};
}
async function klines(sym, tf, extra = '') {
  let err;

    try {
      const r = await fetch(`${base}/api/v3/klines?symbol=${sym}&interval=${tf}&limit=1000${extra}`);
      if (!r.ok) throw new Error(r.status === 400 ? 'Unknown symbol' : 'Server error ' + r.status);
      return (await r.json()).map(k => ({t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]}));
    } catch (e) { err = e; if (e.message === 'Unknown symbol') break; }

}
function message(text) { $('msg').textContent = text || ''; $('msg').style.display = text ? 'block' : 'none'; }
function toast(text) { const t = $('toast'); t.textContent = text; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 6000); }

async function loadChart() {
  const g = ++gen;

  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  data = []; view = []; bid = ask = null; noMore = false; loadingOld = false; draft = selected = null;
  drawings = load('draw_' + cfg.symbol, []); undoS = []; redoS = [];
  updateQuote(); message('Loading ' + cfg.symbol + '…'); render();
  try {
    const d = await klinesTf(cfg.symbol, cfg.tf);
    if (g !== gen) return;
    if (!d.length) throw new Error('No data');
    data = d; view = data; message('');
    barW = Math.max(6, Math.min(24, PW() / 70)); goLatest();
    connect(g);
  } catch (e) {

}
function goLatest() { right = view.length - 1 + Math.max(5, PW() / barW * .4); yAuto = true; render(); }

function connect(g) {
  const s = cfg.symbol.toLowerCase();
  const sock = ws = new WebSocket(`${WS}${s}@kline_${baseOf(cfg.tf)}/${s}@bookTicker`);

      else if (bar.t > last.t) { data.push(bar); if (!replay && right >= data.length - 2) right++; }

}
async function resync(g) {            // refill any candles missed while disconnected
  try {

    if (g !== gen) return;
    const old = data.filter(x => x.t < d[0].t);

/* ---------- coordinates ---------- */
const X = i => PW() - (right - i) * barW;
const I = x => right - (PW() - x) / barW;
const tr = p => cfg.log ? Math.log(p) : p;
const itr = v => cfg.log ? Math.exp(v) : v;
const Y = p => (tr(yMax) - tr(p)) / (tr(yMax) - tr(yMin)) * PH();
const P = y => itr(tr(yMax) - y / PH() * (tr(yMax) - tr(yMin)));
function t2i(t) {
  const n = view.length, step = TFMS[cfg.tf]; if (!n) return 0;
  if (t >= view[n-1].t) return n - 1 + (t - view[n-1].t) / step;
  if (t <= view[0].t) return (t - view[0].t) / step;
  let a = 0, b = n - 1;
  while (b - a > 1) { const m = (a + b) >> 1; view[m].t <= t ? a = m : b = m; }
  return a + (t - view[a].t) / (view[b].t - view[a].t);
}
function i2t(i) {
  const n = view.length, step = TFMS[cfg.tf]; if (!n) return 0;

  if (i <= 0) return view[0].t + i * step;

const sx = pt => X(t2i(pt.t)), sy = pt => Y(pt.p);
const STRAIGHT = ['trend','ray','fib','measure','path','arrow'];
function straighten(p, ref) {   // Shift: make the segment ref -> p perfectly horizontal or vertical
  p = {t: p.t, p: p.p};
  if (Math.abs(sx(p) - sx(ref)) > Math.abs(sy(p) - sy(ref))) p.p = ref.p; else p.t = ref.t;
  return p;
}
function pointAt(x, y) {
  let i = I(x), p = P(y);
  if ((magnet !== invMag) && view.length) {
    i = Math.round(i); const c = view[i];
    if (c) { const near = [c.o,c.h,c.l,c.c].reduce((a,b) => Math.abs(Y(b)-y) < Math.abs(Y(a)-y) ? b : a); if (Math.abs(Y(near)-y) < 18) p = near; }
  }
  return {t: i2t(i), p};
}

/* ---------- formatting ---------- */
function dec(p) { return p >= 100 ? 2 : p >= 1 ? 4 : p >= .01 ? 5 : 8; }
const fmt = (p, d = dec(Math.abs(p))) => p.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2, '0');
const daily = () => TFMS[cfg.tf] >= 864e5;
function dparts(t) {   // daily candles are dated in UTC (exchange day); intraday uses your local time
  const d = new Date(t), u = daily() ? 'getUTC' : 'get';
  return {y:d[u+'FullYear'](), m:d[u+'Month'](), d:d[u+'Date'](), h:d[u+'Hours'](), mi:d[u+'Minutes']()};
}
const fullDate = t => { const p = dparts(t); return `${p.d} ${MON[p.m]} ${p.y}` + (daily() ? '' : ` ${pad(p.h)}:${pad(p.mi)}`); };

/* ---------- indicators ---------- */
function sma(d, n) { let s = 0; return d.map((c,i) => { s += c.c; if (i >= n) s -= d[i-n].c; return i >= n-1 ? s/n : null; }); }
function ema(d, n) { const k = 2/(n+1); let e; return d.map((c,i) => { e = i ? c.c*k + e*(1-k) : c.c; return i >= n-1 ? e : null; }); }

/* ---------- drawing the chart ---------- */
let queued = false;
function render() { if (!queued) { queued = true; requestAnimationFrame(paint); } }
function line(x1,y1,x2,y2) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function tag(y, text, bg, sub) {
  ctx.fillStyle = bg; ctx.fillRect(PW(), y - 10, AXW, sub ? 34 : 20);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(text, PW() + AXW/2, y);

}

function countdown() {

  if (cfg.tf === '1M') { const d = new Date(last.t); end = Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1); }
  let s = Math.max(0, Math.floor((end - Date.now())/1000));

}
function paint() {
  queued = false;
  if (W < AXW + 20 || H < AXH + 20) { DB.hidden = true; return; }
  const fg = cfg.dark ? '#d1d4dc' : '#131722', bg = cfg.dark ? '#131722' : '#fff', edge = cfg.dark ? '#d1d4dc' : '#000';
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.font = '12px -apple-system,sans-serif'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
  if (!view.length) { $('legend').textContent = ''; DB.hidden = true; return; }
  const shown = cfg.ctype === 'heikin' ? heikin(view) : view;
  const first = Math.max(0, Math.floor(I(0))), last = Math.min(view.length-1, Math.ceil(right));
  if (yAuto && last >= first) {

    for (let i = first; i <= last; i++) { lo = Math.min(lo, shown[i].l); hi = Math.max(hi, shown[i].h); }
    const a = tr(lo), b = tr(hi), m = (b - a || a*.01) * .1;

    ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.fillText(fmt(p), PW()+8, y);
  }

  const every = Math.max(1, Math.ceil(70/barW)); let prev = null;
  for (let i = Math.ceil(I(0)/every)*every; i <= right; i += every) {
    const p = dparts(i2t(i)), x = X(i); let label;
    if (daily()) label = prev && prev.y !== p.y ? String(p.y) : (prev && prev.m !== p.m) ? MON[p.m] : String(p.d);
    else label = prev && prev.d !== p.d ? `${p.d} ${MON[p.m]}` : `${pad(p.h)}:${pad(p.mi)}`;
    if (cfg.tf === '1M') label = `${MON[p.m]} ${String(p.y).slice(2)}`;
    prev = p;
    if (cfg.grid) { ctx.strokeStyle = cfg.dark ? '#242a38' : '#eef0f4'; line(x,0,x,PH()); }

    ctx.globalAlpha = 1;
  }

  const bw = Math.max(1, Math.floor(barW*.72));
  if (cfg.ctype === 'line') {
    ctx.strokeStyle = '#3562f6'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = first; i <= last; i++) i === first ? ctx.moveTo(X(i),Y(view[i].c)) : ctx.lineTo(X(i),Y(view[i].c));
    ctx.stroke(); ctx.lineWidth = 1;
  } else for (let i = first; i <= last; i++) {
    const c = shown[i], x = Math.round(X(i))+.5, up = c.c >= c.o, col = up ? cfg.up : cfg.dn;
    if (cfg.ctype === 'bars') { ctx.strokeStyle = up ? '#8a8f99' : cfg.dn; ctx.lineWidth = 1.5; line(x,Y(c.h),x,Y(c.l)); line(x-bw/2,Y(c.o),x,Y(c.o)); line(x,Y(c.c),x+bw/2,Y(c.c)); ctx.lineWidth = 1; continue; }
    ctx.strokeStyle = edge; line(x,Y(c.h),x,Y(c.l));
    const top = Y(Math.max(c.o,c.c)), h = Math.max(1, Y(Math.min(c.o,c.c)) - top);
    ctx.fillStyle = cfg.ctype === 'hollow' && up ? bg : col;
    ctx.fillRect(x-bw/2, top, bw, h); if (bw > 2) ctx.strokeRect(x-bw/2, top, bw, h);
  }
  for (const [on, fn, n, col] of [[cfg.smaOn,sma,cfg.smaN,'#2962ff'],[cfg.emaOn,ema,cfg.emaN,'#9c27b0']]) {
    if (!on) continue;
    const v = fn(view, n); ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.beginPath(); let pen = false;
    for (let i = first; i <= last; i++) { if (v[i] == null) continue; pen ? ctx.lineTo(X(i),Y(v[i])) : ctx.moveTo(X(i),Y(v[i])); pen = true; }
    ctx.stroke(); ctx.lineWidth = 1;
  }
  if (!hidden) drawings.forEach(d => { if (vis(d)) drawShape(d, d === selected || multi.includes(d), fg); });
  if (draft) drawShape(draft, true, fg);

  ctx.strokeStyle = cfg.dark ? '#2a2e39' : '#e0e3eb'; line(PW(),0,PW(),PH()); line(0,PH(),W,PH());
  for (const a of alerts.filter(a => a.symbol === cfg.symbol)) {
    ctx.setLineDash([6,4]); ctx.strokeStyle = '#7e57c2'; line(0,Y(a.price),PW(),Y(a.price)); ctx.setLineDash([]); tag(Y(a.price), fmt(a.price), '#7e57c2');
  }
  const lc = view[view.length-1], ly = Y(lc.c);
  ctx.setLineDash([2,3]); ctx.strokeStyle = fg; line(0,ly,PW(),ly); ctx.setLineDash([]);
  tag(ly, fmt(lc.c), cfg.dark ? '#555b69' : '#000', countdown());
  if (hover && hover.x < PW() && hover.y < PH()) {
    ctx.setLineDash([5,5]); ctx.strokeStyle = '#8b909c'; const hx = X(Math.round(I(hover.x)));
    line(hx,0,hx,PH()); line(0,hover.y,PW(),hover.y); ctx.setLineDash([]);
    if (altDown) { ctx.fillStyle = 'rgba(41,98,255,.25)'; ctx.strokeStyle = '#2962ff'; ctx.beginPath(); ctx.arc(hover.x, hover.y, 14, 0, 7); ctx.fill(); ctx.stroke(); }
    tag(hover.y, fmt(P(hover.y)), '#434651');
    const s = fullDate(i2t(Math.round(I(hover.x)))), w = ctx.measureText(s).width + 16;
    ctx.fillStyle = '#434651'; ctx.fillRect(hx-w/2, PH()+3, w, 22); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(s, hx, PH()+14);
  }

  const hi = hover ? Math.round(I(hover.x)) : view.length-1, c = view[hi] || lc, ch = (c.c-c.o)/c.o*100;
  $('legend').textContent = `${cfg.symbol} · ${$('tf').selectedOptions[0].text}  O ${fmt(c.o)}  H ${fmt(c.h)}  L ${fmt(c.l)}  C ${fmt(c.c)}  (${ch>=0?'+':''}${ch.toFixed(2)}%)`
    + (cfg.smaOn ? `  · SMA ${cfg.smaN}` : '') + (cfg.emaOn ? `  · EMA ${cfg.emaN}` : '') + (replay ? '  · REPLAY' : '');
  updateDrawBar();
}

/* ---------- drawing tools ---------- */
function position(d) {   // points: entry, target, stop (+ width from target point)
  const [e, t, s] = d.pts, x1 = sx(e), x2 = Math.max(x1+20, sx(t));
  return {e, t, s, x1, x2};
}
function drawShape(d, sel, fg) {
  const q = d.pts.map(p => [sx(p), sy(p)]), [a, b = a] = q;
  const col = d.color || '#2962ff', A = d.alpha ?? 1;
  ctx.globalAlpha = A;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = d.w || 1.6; ctx.textAlign = 'left';
  ctx.setLineDash(d.dash === 'dashed' ? [9,6] : d.dash === 'dotted' ? [2,5] : []);

function announce(what) { if (PANE != null && parent !== window) parent.postMessage({cc:'sync', what, symbol:cfg.symbol, tf:cfg.tf, ctype:cfg.ctype, from:PANE}, '*'); }
window.addEventListener('message', e => {   // inside a pane: receive synced values
  if (PANE == null || !e.data || e.data.cc !== 'apply') return;
  const m = e.data;
  if (m.what === 'symbol' && m.symbol !== cfg.symbol) { cfg.symbol = $('symbol').value = m.symbol; saveCfg(); loadChart(); }
  if (m.what === 'tf' && m.tf !== cfg.tf) { ensureTfOption(m.tf); cfg.tf = $('tf').value = m.tf; saveCfg(); loadChart(); }
  if (m.what === 'ctype' && m.ctype !== cfg.ctype) { cfg.ctype = $('ctype').value = m.ctype; saveCfg(); }
});
if (PANE == null) {
  // each layout: n panes, t = CSS grid-template-areas rows (same letter = same pane)
  const LAYOUTS = [
    {n:1,t:['a']},
    {n:2,t:['a','b']}, {n:2,t:['ab']},
    {n:3,t:['a','b','c']}, {n:3,t:['abc']}, {n:3,t:['ab','cc']}, {n:3,t:['aa','bc']}, {n:3,t:['ab','ac']}, {n:3,t:['ac','bc']},
    {n:4,t:['ab','cd']}, {n:4,t:['abcd']}, {n:4,t:['a','b','c','d']}, {n:4,t:['aab','aac','aad']}, {n:4,t:['abb','cbb','dbb']}, {n:4,t:['aaa','bcd']}, {n:4,t:['abc','ddd']}, {n:4,t:['ab','cb','db']}, {n:4,t:['aa','bc','dd']},
    {n:5,t:['abc','dee']}, {n:5,t:['abc','dbe']}, {n:5,t:['abcde']}, {n:5,t:['a','b','c','d','e']}, {n:5,t:['aabb','cdee']}, {n:5,t:['abb','acc','dee']}, {n:5,t:['abcd','eeee']}, {n:5,t:['aaaa','bcde']},
    {n:6,t:['abc','def']}, {n:6,t:['ab','cd','ef']}, {n:6,t:['abcdef']}, {n:6,t:['a','b','c','d','e','f']}, {n:6,t:['aabc','aade','ffff']}, {n:6,t:['abcd','eeff']},
    {n:7,t:['abcd','efgg']}, {n:7,t:['abc','def','ggg']}, {n:7,t:['abcdefg']}, {n:7,t:['a','b','c','d','e','f','g']},
    {n:8,t:['abcd','efgh']}, {n:8,t:['ab','cd','ef','gh']}, {n:8,t:['abcdefgh']}, {n:8,t:['a','b','c','d','e','f','g','h']}
  ];
  const sync = Object.assign({symbol:false, tf:false, ctype:false}, load('laySync', {}));
  let cur = Math.min(Math.max(0, load('layout', 0)), LAYOUTS.length - 1);

  const icon = t => {   // draw the template as a tiny SVG: one rect per pane
    const rows = t.length, cols = t[0].length, w = 28, h = 24, seen = {};
    let out = '';
    t.forEach((r, y) => [...r].forEach((ch, x) => { (seen[ch] = seen[ch] || {x0:x, x1:x, y0:y, y1:y}); const o = seen[ch]; o.x0 = Math.min(o.x0,x); o.x1 = Math.max(o.x1,x); o.y0 = Math.min(o.y0,y); o.y1 = Math.max(o.y1,y); }));
    for (const k in seen) { const o = seen[k], cw = w/cols, ch = h/rows;
      out += `<rect x="${2 + o.x0*cw + .5}" y="${3 + o.y0*ch + .5}" width="${(o.x1-o.x0+1)*cw - 1}" height="${(o.y1-o.y0+1)*ch - 1}" rx="1.5"/>`; }
    return `<svg viewBox="0 0 32 30">${out}</svg>`;
  };
  $('layBtn').innerHTML = '';
  const paintBtn = () => $('layBtn').innerHTML = icon(LAYOUTS[cur].t);
  const frames = [], G = 3;
  let colFr = [], rowFr = [], spls = [];
  const sum = a => a.reduce((x, y) => x + y, 0);
  function applyFr() {
    const box = $('panes');
    box.style.gridTemplateColumns = colFr.map(f => `minmax(0,${f}fr)`).join(' ');
    box.style.gridTemplateRows = rowFr.map(f => `minmax(0,${f}fr)`).join(' ');
  }
  function geom() {   // pixel start + size of every column / row
    const box = $('panes'), aw = box.clientWidth - G * (colFr.length - 1), ah = box.clientHeight - G * (rowFr.length - 1), sc = sum(colFr), sr = sum(rowFr);
    const cw = colFr.map(f => f / sc * aw), rh = rowFr.map(f => f / sr * ah), cx = [], ry = [];
    let x = 0, y = 0; cw.forEach(w => { cx.push(x); x += w + G; }); rh.forEach(h => { ry.push(y); y += h + G; });
    return {cw, rh, cx, ry, aw, ah, sc, sr};
  }
  function placeSplitters() {
    if (!spls.length) return; const g = geom();
    spls.forEach(s => {
      if (s.axis === 'c') { s.el.style.left = (g.cx[s.i] + g.cw[s.i] + G / 2 - 5.5) + 'px'; s.el.style.top = g.ry[s.a] + 'px'; s.el.style.height = (g.ry[s.b] + g.rh[s.b] - g.ry[s.a]) + 'px'; }
      else { s.el.style.top = (g.ry[s.i] + g.rh[s.i] + G / 2 - 5.5) + 'px'; s.el.style.left = g.cx[s.a] + 'px'; s.el.style.width = (g.cx[s.b] + g.cw[s.b] - g.cx[s.a]) + 'px'; }
    });
  }
  function buildSplitters() {   // a handle only where two different charts actually touch
    spls.forEach(s => s.el.remove()); spls = [];
    const t = LAYOUTS[cur].t, R = t.length, C = t[0].length, box = $('panes');
    const add = (axis, i, a, b) => { const el = document.createElement('div'); el.className = 'spl ' + (axis === 'c' ? 'v' : 'h'); el.title = 'Drag to resize · double-click to reset'; box.append(el); const s = {el, axis, i, a, b}; spls.push(s); wireSplitter(s); };
    for (let c = 0; c < C - 1; c++) for (let r = 0; r < R; r++) {
      if (t[r][c] === t[r][c + 1]) continue; let r2 = r; while (r2 + 1 < R && t[r2 + 1][c] !== t[r2 + 1][c + 1]) r2++; add('c', c, r, r2); r = r2;
    }
    for (let r = 0; r < R - 1; r++) for (let c = 0; c < C; c++) {
      if (t[r][c] === t[r + 1][c]) continue; let c2 = c; while (c2 + 1 < C && t[r][c2 + 1] !== t[r + 1][c2 + 1]) c2++; add('r', r, c, c2); c = c2;
    }
    placeSplitters();
  }
  function wireSplitter(s) {
    const el = s.el;
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('act'); $('panes').classList.add('dragging');
      const arr = s.axis === 'c' ? colFr : rowFr, g = geom(), start = arr.slice(), p0 = s.axis === 'c' ? e.clientX : e.clientY;
      const perFr = s.axis === 'c' ? g.sc / g.aw : g.sr / g.ah, min = sum(arr) / arr.length * .15;
      el.onpointermove = ev => {
        let d = ((s.axis === 'c' ? ev.clientX : ev.clientY) - p0) * perFr;
        if (start[s.i] + d < min) d = min - start[s.i];
        if (start[s.i + 1] - d < min) d = start[s.i + 1] - min;
        arr[s.i] = start[s.i] + d; arr[s.i + 1] = start[s.i + 1] - d; applyFr(); placeSplitters();
      };
      el.onpointerup = el.onpointercancel = () => {
        el.onpointermove = el.onpointerup = el.onpointercancel = null; el.classList.remove('act'); $('panes').classList.remove('dragging');
        const all = load('layFr', {}); all[cur] = {c: colFr.slice(), r: rowFr.slice()}; save('layFr', all);
      };
    });
    el.addEventListener('dblclick', () => {
      colFr = colFr.map(() => 1); rowFr = rowFr.map(() => 1); applyFr(); placeSplitters();
      const all = load('layFr', {}); delete all[cur]; save('layFr', all);
    });
  }
  new ResizeObserver(placeSplitters).observe($('panes'));
  function apply() {
    const lay = LAYOUTS[cur], box = $('panes');
    save('layout', cur); paintBtn();
    if (lay.n === 1) { document.body.classList.remove('multi'); box.innerHTML = ''; frames.length = 0; spls = []; setTimeout(() => window.dispatchEvent(new Event('resize')), 0); return; }
    document.body.classList.add('multi');
    box.style.gridTemplateAreas = lay.t.map(r => `"${[...r].join(' ')}"`).join(' ');
    const C = lay.t[0].length, R = lay.t.length, sv = load('layFr', {})[cur];
    colFr = sv && sv.c && sv.c.length === C ? sv.c.slice() : Array(C).fill(1);
    rowFr = sv && sv.r && sv.r.length === R ? sv.r.slice() : Array(R).fill(1);
    while (frames.length > lay.n) frames.pop().remove();
    while (frames.length < lay.n) {
      const f = document.createElement('iframe'), i = frames.length;
      f.dataset.i = i; f.title = 'Chart ' + (i + 1); f.allow = 'fullscreen';
      f.src = `?pane=${i}` + (lay.n > 4 ? '&tight=1' : '');
      box.append(f); frames.push(f);
    }
    frames.forEach((f, i) => f.style.gridArea = String.fromCharCode(97 + i));
    applyFr(); buildSplitters();
    if (lay.n > 4) frames.forEach(f => { try { f.contentDocument.body.classList.add('tight'); } catch {} }); else frames.forEach(f => { try { f.contentDocument.body.classList.remove('tight'); } catch {} });
  }
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.cc !== 'sync' || !sync[m.what]) return;
    frames.forEach((f, i) => { if (i !== m.from) f.contentWindow.postMessage({cc:'apply', what:m.what, symbol:m.symbol, tf:m.tf, ctype:m.ctype}, '*'); });
  });
  function buildPop() {
    let html = '', n = 0;
    LAYOUTS.forEach((l, i) => {
      if (l.n !== n) { if (n) html += '</div>'; n = l.n; html += `<div class="lr"><span class="n">${n}</span>`; }
      html += `<button class="lb${i === cur ? ' sel' : ''}" data-i="${i}" title="${n} chart${n > 1 ? 's' : ''}">${icon(l.t)}</button>`;
    });
    html += '</div><div class="sy">' + [['symbol','Sync all symbols'],['tf','Sync all intervals'],['ctype','Sync chart types']]
      .map(([k, t]) => `<label><input type="checkbox" data-k="${k}"${sync[k] ? ' checked' : ''}>${t}</label>`).join('') + '</div>';
    $('layPop').innerHTML = html;
  }
  $('layBtn').onclick = e => {
    e.stopPropagation(); const pop = $('layPop');
    if (pop.style.display === 'block') { pop.style.display = 'none'; return; }
    buildPop(); const r = $('layBtn').getBoundingClientRect();
    pop.style.left = Math.max(6, Math.min(r.left, innerWidth - pop.offsetWidth - 6)) + 'px'; pop.style.top = (r.bottom + 6) + 'px'; pop.style.display = 'block';
    pop.style.left = Math.max(6, Math.min(r.left, innerWidth - pop.offsetWidth - 6)) + 'px';
  };
  $('layPop').onclick = e => {
    e.stopPropagation();
    const b = e.target.closest('.lb'); if (b) { cur = +b.dataset.i; apply(); $('layPop').style.display = 'none'; return; }
    const c = e.target.closest('input[data-k]');
    if (c) { sync[c.dataset.k] = c.checked; save('laySync', sync); }
  };
  document.addEventListener('click', () => { $('layPop').style.display = 'none'; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('layPop').style.display = 'none'; });
  paintBtn(); if (cur) apply();
} else {
  $('layBtn').style.display = 'none';
}

/* ---------- start ---------- */
new ResizeObserver(() => {
  const r = $('wrap').getBoundingClientRect(), k = devicePixelRatio || 1, oldPW = PW();
  if (view.length && oldPW > 0 && r.width > AXW) { const gap = right - (view.length-1); if (gap > 0) right -= gap * (1 - (r.width-AXW)/oldPW); }
  W = r.width; H = r.height; cv.width = W*k; cv.height = H*k; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(k,0,0,k,0,0); render();
}).observe($('wrap'));
setInterval(() => {
  const d = new Date(), off = -d.getTimezoneOffset()/60;
  $('clock').textContent = `${d.toLocaleTimeString('en-GB')} UTC${off >= 0 ? '+' : ''}${off}`;
  render();
}, 1000);
ensureTfOption(cfg.tf); $('symbol').value = cfg.symbol; $('tf').value = cfg.tf; $('ctype').value = cfg.ctype;
theme(); paintSide(); updatePaper();
W = $('wrap').clientWidth; H = $('wrap').clientHeight;
loadChart();
</script>
</body>
</html>
